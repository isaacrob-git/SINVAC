<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SINVAC - Sistema Nacional de Información de Vacunación</title>
  <link rel="stylesheet" href="../css/output.css">
</head>
<body class="bg-[var(--color-sinvac-background)] min-h-screen flex flex-col justify-between font-sans antialiased">

  <!-- Header Institucional -->
  <header class="bg-white border-b border-gray-200 py-4 px-6 sm:px-10 flex justify-between items-center shadow-xs">
    <div class="flex items-center space-x-3">
      <div class="bg-[var(--color-sinvac-900)] text-white font-black px-3.5 py-2 rounded-xl text-lg tracking-wider shadow-sm">
        SINVAC
      </div>
      <div>
        <h1 class="text-xs font-bold uppercase tracking-widest text-[var(--color-sinvac-700)]">República Bolivariana de Venezuela</h1>
        <p class="text-[11px] text-gray-500 font-medium">Sistema Nacional de Información de Vacunación</p>
      </div>
    </div>
    <a href="#" class="inline-flex items-center text-xs font-semibold text-[var(--color-sinvac-700)] bg-[var(--color-sinvac-100)] px-3.5 py-2 rounded-lg hover:bg-emerald-100 transition">
      <span>Portal Ciudadano</span>
      <svg class="w-4 h-4 ml-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
    </a>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-100 p-8 sm:p-10 relative overflow-hidden">
      
      <!-- Detalle decorativo superior -->
      <div class="absolute top-0 left-0 right-0 h-1.5 bg-[var(--color-sinvac-700)]"></div>

      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-[var(--color-sinvac-100)] text-[var(--color-sinvac-900)] mb-4">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <h2 class="text-2xl font-extrabold text-[var(--color-sinvac-900)]">Inicio de Sesión</h2>
        <p class="text-xs text-gray-500 mt-1">Ingrese sus credenciales autorizadas por el sistema</p>
      </div>

      <form action="dashboard.html" method="GET" class="space-y-5">
        <div>
          <label for="username" class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Usuario o Correo Institucional</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </span>
            <input 
              type="text" 
              id="username" 
              placeholder="ej. c.mendoza"
              class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-sinvac-700)] focus:border-transparent transition bg-gray-50/50"
              required
            >
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </span>
            <input 
              type="password" 
              id="password" 
              placeholder="••••••••"
              class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-sinvac-700)] focus:border-transparent transition bg-gray-50/50"
              required
            >
          </div>
        </div>

        <div class="flex items-center justify-between text-xs pt-1">
          <label class="flex items-center text-gray-600 cursor-pointer">
            <input type="checkbox" class="rounded border-gray-300 text-[var(--color-sinvac-700)] focus:ring-[var(--color-sinvac-700)] w-4 h-4 mr-2">
            Recordar en este equipo
          </label>
          <a href="#" class="text-[var(--color-sinvac-700)] font-semibold hover:underline">¿Problemas de acceso?</a>
        </div>

        <button 
          type="submit" 
          class="w-full bg-[var(--color-sinvac-900)] hover:bg-[var(--color-sinvac-700)] text-white font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-md flex items-center justify-center space-x-2 text-sm"
        >
          <span>Iniciar Sesión</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
        </button>
      </form>


    </div>
  </main>

  <footer class="py-4 text-center text-xs text-gray-400 bg-white border-t border-gray-200">
    SINVAC &copy; 2026 - Todos los derechos reservados
  </footer>
</body>
</html>
